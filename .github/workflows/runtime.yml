# Runtime gate: boots the app and uses it in a real browser before a change
# (a Renovate update included) can merge. Fails on runtime errors: uncaught
# exceptions, console errors, React hydration errors, failed same-origin
# requests, 4xx/5xx, blank pages, crash screens. Advisory on top: screenshot
# diff against the last master run, and an AI explorer (Gemini free
# tier, GEMINI_API_KEY secret) that uses the app like a person for major or
# framework updates, the `ai-explore` label, the weekly schedule and manual
# runs. See docs/runtime-gate.md in rishitank/.github.
name: runtime

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "43 5 * * 4"
  workflow_dispatch:

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    name: runtime
    uses: rishitank/.github/.github/workflows/runtime-gate.yml@8e8a1977309ac958bafd85825c7cd800be8c8ac8
    permissions:
      contents: read
      actions: read
      pull-requests: write
    with:
      # Vite build on the latest Current Node (.nvmrc is `node`), installed
      # with `npm ci` from package-lock.json.
      mode: static
      build: npm run build
      static-dir: dist
      # The generated service worker answers every navigation with
      # index.html, so serve unknown paths the same way.
      spa: true
      port: 3000
    secrets:
      gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
