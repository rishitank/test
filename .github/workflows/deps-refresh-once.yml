# ONE-SHOT, TEMPORARY. Runs a dependency-update command on a GitHub runner and
# commits the resulting lockfile change back to this branch, so a lockfile
# never has to be hand-transcribed. Delete this file in the very next commit
# (that commit, pushed by a person/agent rather than GITHUB_TOKEN, is what
# triggers CI on the refreshed lockfile).
#
# Fill in: ci/runtime-gate-and-hygiene, node (node | pnpm | bun | rust | python), .,
# rm -f package-lock.json public/index.html src/index.js src/App.js src/App.test.js && rm -rf config scripts && npm install --package-lock-only --ignore-scripts (e.g. `npm update`, `pnpm update -r`, `cargo update -p rustls --precise 0.23.45`),
# npm ci --ignore-scripts && npm test && npm run build (e.g. `npm ci --ignore-scripts`, `pnpm install --frozen-lockfile --ignore-scripts`, `cargo check --locked`).
name: deps-refresh-once

on:
  push:
    branches: [ci/runtime-gate-and-hygiene]
    paths: [.github/workflows/deps-refresh-once.yml]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: current
      - name: Update
        run: |
          set -euxo pipefail
          rm -f package-lock.json public/index.html src/index.js src/App.js src/App.test.js && rm -rf config scripts && npm install --package-lock-only --ignore-scripts
      - name: Verify the lockfile installs
        run: |
          set -euxo pipefail
          npm ci --ignore-scripts && npm test && npm run build
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .github/workflows/deps-refresh-once.yml || true
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git --no-pager diff --cached --stat
          git commit -m "build: generate package-lock.json for Vite and remove the replaced CRA/webpack files" -m "Ran on a runner by the one-shot deps-refresh-once workflow: rm -f package-lock.json public/index.html src/index.js src/App.js src/App.test.js && rm -rf config scripts && npm install --package-lock-only --ignore-scripts"
          git push
