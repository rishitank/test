# Vulnerable dependencies (osv-scanner), leaked secrets (gitleaks, full
# history) and the ecosystem's own audit, via the shared workflow.
name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: rishitank/.github/.github/workflows/security.yml@v1
    with:
      ecosystem: node
      # No .nvmrc in this repo: the audit's setup-node reads package.json
      # instead (no engines field there, so it uses the runner's Node).
      node-version-file: package.json
      # The repo has no lockfile, so osv-scanner finds no package sources and
      # would exit 128. Allow that rather than fail on a missing input;
      # gitleaks still scans the full history.
      osv-scan-args: |
        --allow-no-lockfiles
        --recursive
        ./
