# Vulnerable dependencies (osv-scanner), leaked secrets (gitleaks, full
# history) and the ecosystem's own audit, via the shared workflow.
name: security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    uses: rishitank/.github/.github/workflows/security.yml@5c644123ed93759cf78aa32d9d119150910e113e # v1
    with:
      ecosystem: node
      # osv-scanner scans package-lock.json; the audit's setup-node reads
      # .nvmrc (`node`, the latest Current release), the shared default.
